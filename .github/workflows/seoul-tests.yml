name: Seoul IA FiveM Tests
on:
  push:
    paths:
      - 'seoul_web.py'
      - 'web/**'
      - 'core/**'
      - 'menus/**'
      - 'tests/**'
      - 'app.py'
      - 'seoul_ia_fivem.py'
      - '.github/workflows/seoul-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run Seoul web smoke tests
        run: python -m unittest discover -s tests -p 'test_seoul_web.py' -v
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run CLI and framework smoke tests
        run: python -m pytest tests/test_smoke.py -v
