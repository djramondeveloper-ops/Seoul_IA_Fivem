name: Import upstream MZ Agent
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone original project
        run: git clone --depth 1 https://github.com/Mazus-Ofc/mz_fivem_agent.git /tmp/mz-upstream
      - name: Preserve original features and add Seoul detector
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='core/auto_framework_detector.py' /tmp/mz-upstream/ ./
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='Seoul IA Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import complete upstream MZ FiveM Agent'
            git push
          fi
